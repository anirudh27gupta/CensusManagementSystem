<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title : 'Census Management System'}">Census Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-navy: #123047;
            --primary-accent: #0b7495;
            --primary-accent-dark: #075d79;
            --bg-light: #f4f7f8;
            --surface: #ffffff;
            --text-main: #172a33;
            --text-muted: #647481;
            --border-soft: #dfe7ea;
        }
        body {
            background-color: var(--bg-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text-main);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 0.95rem;
        }
        .navbar-custom {
            background: linear-gradient(100deg, var(--primary-navy), #174d61);
            box-shadow: 0 3px 12px rgba(18, 48, 71, .18);
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.2px;
        }
        .navbar-custom .nav-link {
            border-radius: 7px;
            color: rgba(255, 255, 255, .82);
            font-weight: 600;
            margin: 2px 1px;
            padding: .45rem .65rem;
            transition: background-color .18s ease, color .18s ease;
        }
        .navbar-custom .nav-link:hover,
        .navbar-custom .nav-link:focus {
            background: rgba(255, 255, 255, .14);
            color: #fff;
        }
        .stat-card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(23, 42, 51, .08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(23, 42, 51, .13);
        }
        .table-card {
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(23, 42, 51, .05);
            background: var(--surface);
        }
        .badge-role {
            font-size: 0.8rem;
            padding: 0.35em 0.65em;
        }
        .btn {
            border-radius: 8px;
            font-weight: 600;
        }
        .btn-primary {
            --bs-btn-bg: var(--primary-accent);
            --bs-btn-border-color: var(--primary-accent);
            --bs-btn-hover-bg: var(--primary-accent-dark);
            --bs-btn-hover-border-color: var(--primary-accent-dark);
            --bs-btn-active-bg: var(--primary-accent-dark);
            --bs-btn-active-border-color: var(--primary-accent-dark);
        }
        .btn-outline-primary {
            --bs-btn-color: var(--primary-accent-dark);
            --bs-btn-border-color: #78b4c5;
            --bs-btn-hover-bg: var(--primary-accent);
            --bs-btn-hover-border-color: var(--primary-accent);
        }
        .form-control, .form-select, .input-group-text {
            border-color: #cbd8dd;
            min-height: 42px;
        }
        textarea.form-control { min-height: auto; }
        .form-control:focus, .form-select:focus {
            border-color: #48a4bb;
            box-shadow: 0 0 0 .22rem rgba(11, 116, 149, .16);
        }
        .form-label { margin-bottom: .4rem; }
        .table > :not(caption) > * > * { padding: .8rem .75rem; }
        .table thead th {
            background: #eef5f6;
            color: #425966;
            font-size: .74rem;
            letter-spacing: .045em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .table-hover > tbody > tr { transition: background-color .15s ease; }
        .alert { border: 0; border-radius: 10px; box-shadow: 0 2px 8px rgba(23, 42, 51, .06); }
        .page-link { color: var(--primary-accent-dark); }
        .pagination { --bs-pagination-active-bg: var(--primary-accent); --bs-pagination-active-border-color: var(--primary-accent); }
        footer {
            margin-top: auto;
            background-color: var(--surface);
            border-top: 1px solid var(--border-soft);
        }
        @media (max-width: 991.98px) {
            .navbar-custom .nav-link { padding-left: .75rem; }
            .navbar-custom .d-flex[sec\:authorize] { margin: .75rem 0 .25rem; }
        }
        @media (max-width: 575.98px) {
            .container-fluid.px-4, .container.px-4 { padding-left: 1rem !important; padding-right: 1rem !important; }
            .table-card { border-radius: 10px; }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-2" th:fragment="navbar">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <i class="bi bi-people-fill me-2 fs-4 text-info"></i>
            <span>Census Portal</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#censusNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="censusNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <!-- Admin Navigation Links -->
                <li class="nav-link-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                </li>
                <li class="nav-link-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/regions}"><i class="bi bi-geo-alt me-1"></i> Regions</a>
                </li>
                <li class="nav-link-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/enumerators}"><i class="bi bi-person-badge me-1"></i> Enumerators</a>
                </li>

                <!-- Enumerator Navigation Link -->
                <li class="nav-link-item" sec:authorize="hasRole('ENUMERATOR')">
                    <a class="nav-link" th:href="@{/enumerator-home}"><i class="bi bi-house me-1"></i> My Region</a>
                </li>

                <!-- Common Links for Admin & Enumerator -->
                <li class="nav-link-item">
                    <a class="nav-link" th:href="@{/households}"><i class="bi bi-building me-1"></i> Households</a>
                </li>
                <li class="nav-link-item">
                    <a class="nav-link" th:href="@{/persons}"><i class="bi bi-person-lines-fill me-1"></i> Citizens</a>
                </li>

                <!-- Reports (Admin Only) -->
                <li class="nav-link-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/reports}"><i class="bi bi-bar-chart-fill me-1"></i> Reports &amp; Analytics</a>
                </li>
            </ul>

            <!-- User Status & Logout -->
            <div class="d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                <div class="text-white text-end d-none d-md-block">
                    <span class="fw-bold" sec:authentication="name">Username</span>
                    <span sec:authorize="hasRole('ADMIN')" class="badge bg-primary badge-role ms-1">ADMIN</span>
                    <span sec:authorize="hasRole('ENUMERATOR')" class="badge bg-success badge-role ms-1">ENUMERATOR</span>
                </div>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i> Logout
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- Alert messages fragment -->
<div th:fragment="alerts" class="container-fluid px-4 mt-3">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}">Operation successful!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}">An error occurred!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<!-- Footer fragment -->
<footer class="py-3 text-center text-muted" th:fragment="footer">
    <div class="container">
        <small>&copy; 2026 National Census Management System | Built with Java 17+, Spring Boot 3 &amp; Thymeleaf</small>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script th:src="@{/js/preventSleep.js}"></script>
</footer>

</body>
</html>
