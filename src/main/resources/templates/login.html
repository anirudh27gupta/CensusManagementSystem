<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Census Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top right, #2a8298 0%, transparent 38%), linear-gradient(135deg, #102d43 0%, #174d61 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(0,0,0,0.27);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(115deg, #102d43, #174d61);
            color: white;
            padding: 30px 24px;
            text-align: center;
        }
        .credential-box {
            background-color: #f1f7f8;
            border-radius: 10px;
            padding: 12px;
            font-size: 0.85rem;
        }
        .form-control, .input-group-text { min-height: 44px; border-color: #cbd8dd; }
        .form-control:focus { border-color: #48a4bb; box-shadow: 0 0 0 .22rem rgba(11, 116, 149, .16); }
        .btn-primary { background-color: #0b7495; border-color: #0b7495; }
        .btn-primary:hover { background-color: #075d79; border-color: #075d79; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="fs-1 text-info mb-2"><i class="bi bi-people-fill"></i></div>
        <h4 class="fw-bold mb-1">Census Management System</h4>
        <p class="text-white-50 mb-0 small">Official Population &amp; Demographics Registry</p>
    </div>

    <div class="p-4 p-md-5">
        <!-- Error / Logout messages -->
        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
            <i class="bi bi-exclamation-circle-fill me-1"></i> <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success py-2 small" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successMessage}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>

        <!-- Quick Demo Credentials Box for Evaluation -->
        <div class="credential-box mt-4 border">
            <div class="fw-bold text-dark mb-1"><i class="bi bi-info-circle me-1 text-primary"></i> Demo Credentials:</div>
            <div class="d-flex justify-content-between text-muted mb-1">
                <span><strong>Admin:</strong> admin</span>
                <span>pass: <code>admin123</code></span>
            </div>
            <div class="d-flex justify-content-between text-muted mb-1">
                <span><strong>Enumerator (Mumbai):</strong> enum_mumbai</span>
                <span>pass: <code>enum123</code></span>
            </div>
            <div class="d-flex justify-content-between text-muted">
                <span><strong>Enumerator (Bangalore):</strong> enum_bangalore</span>
                <span>pass: <code>enum123</code></span>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/preventSleep.js}"></script>
</body>
</html>
